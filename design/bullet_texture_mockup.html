<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>子弹贴图界面 · 纯净设计稿</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0A1220;
    overflow: hidden;
  }
  /* 子弹界面：仅承载子弹贴图，无标题、无序号、无卡片边框、无装饰 */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 极轻的径向渐晕，只为让贴图从背景中浮现，不引入边框/装饰 */
    background: radial-gradient(120% 120% at 50% 45%, #14233c 0%, #0A1220 70%, #070d18 100%);
  }
  .bullet {
    max-width: 82vw;
    max-height: 82vh;
    width: auto;
    height: auto;
    /* 完整呈现，不裁剪；等比重缩放保证清晰 */
    object-fit: contain;
    /* 仅一层极淡投影，使贴图清晰脱离背景，非边框/装饰 */
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.55));
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
