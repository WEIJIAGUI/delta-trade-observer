<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>子弹界面 · 纯净贴图网格布局</title>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #0A1220; color: #d4deee;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap {
    min-height: 100vh;
    box-sizing: border-box;
    padding: 28px clamp(20px, 5vw, 80px) 48px;
    background: radial-gradient(130% 120% at 50% 0%, #14233c 0%, #0A1220 65%, #070d18 100%);
  }
  /* 极简界面头部：仅口径名，无边框/无装饰 */
  .head {
    display: flex; align-items: baseline; gap: 12px;
    margin: 0 0 22px 4px;
  }
  .head .cal { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  .head .sub { font-size: 12px; color: #708099; }
  /* 子弹贴图网格：纯贴图、无序号、无边框、无卡片底色 */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(16px, 2.4vw, 34px);
    max-width: 1100px;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1 / 1;
    padding: 10px;
  }
  .bullet {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,0.5));
    user-select: none; -webkit-user-drag: none;
  }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
